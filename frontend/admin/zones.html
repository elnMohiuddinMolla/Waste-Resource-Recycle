<body>
  <header id="app-header" class="site-header"></header>

  <main class="container">
    <div class="page-title">
      <h1>Zones</h1>
      <button type="button" class="btn btn-primary" id="add">Add zone</button>
    </div>

    <section class="card">
      <p class="muted small">Zones are never deleted. Deactivating one hides it from registration and new requests; existing users and requests keep it.</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Zone</th><th>Description</th><th>Status</th><th></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">Waste Resource Recycle — CSE-3112 Software Engineering Lab</div>
  </footer>
