<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My dashboard — WRR</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/pages/user-dashboard.js"></script>
</head>
<body class="db-page">
  <header id="app-header" class="site-header"></header>

  <main class="container db">
    <!-- Greeting, the two main actions and the balance -->
    <section class="db-hero">
      <div class="db-hero-text">
        <p class="db-date" id="today"></p>
        <h1 id="greeting">Loading…</h1>
        <p class="db-chip" id="zone"></p>
        <!-- NFR-01: "New pickup request" is one tap away from the dashboard -->
        <div class="db-hero-actions">
          <a class="btn btn-accent" href="/user/new-request.html"><span data-icon="plus"></span>New pickup request</a>
          <a class="btn btn-ghost" href="/user/redeem.html"><span data-icon="cash"></span>Redeem points</a>
        </div>
      </div>
      <a class="db-balance" href="/user/history.html" aria-label="Available points — open my points history">
        <span class="db-balance-label">Available points</span>
        <span class="db-balance-value" id="stat-balance">—</span>
        <span class="db-balance-cash" id="stat-bdt"></span>
        <progress class="db-progress" id="redeem-progress" max="100" value="0"></progress>
        <span class="db-balance-note" id="redeem-note"></span>
      </a>
    </section>

    <section class="db-stats" aria-label="Your summary">
      <a class="db-stat" href="/user/requests.html">
        <span class="db-stat-icon db-tone-blue" data-icon="truck"></span>
        <span class="db-stat-body">
          <span class="db-stat-value" id="stat-active">—</span>
          <span class="db-stat-label">Active requests</span>
        </span>
      </a>
      <a class="db-stat" href="/user/requests.html?status=Completed">
        <span class="db-stat-icon db-tone-green" data-icon="check"></span>
        <span class="db-stat-body">
          <span class="db-stat-value" id="stat-completed">—</span>
          <span class="db-stat-label">Completed pickups</span>
        </span>
      </a>
      <a class="db-stat" href="/user/requests.html" id="next-link">
        <span class="db-stat-icon db-tone-amber" data-icon="clock"></span>
        <span class="db-stat-body">
          <span class="db-stat-value db-stat-value-sm" id="stat-next">—</span>
          <span class="db-stat-label">Next pickup</span>
        </span>
      </a>
      <a class="db-stat" href="/user/notifications.html">
        <span class="db-stat-icon db-tone-pink" data-icon="bell"></span>
        <span class="db-stat-body">
          <span class="db-stat-value" id="stat-unread">—</span>
          <span class="db-stat-label">Unread notifications</span>
        </span>
      </a>
    </section>

    <div class="db-grid">
      <section class="card db-card">
        <div class="db-card-head">
          <h2>Current pickup</h2>
          <a href="/user/requests.html" class="small" id="tracker-link">My requests</a>
        </div>
        <div id="tracker"></div>
      </section>

      <section class="card db-card">
        <div class="db-card-head">
          <h2>Latest requests</h2>
          <a href="/user/requests.html" class="small">See all</a>
        </div>
        <div id="latest"></div>
      </section>
    </div>

    <h2 class="db-h2">Quick actions</h2>
    <div id="shortcuts" class="db-tiles"></div>
  </main>

  <footer class="site-footer">
    <div class="container">Waste Resource Recycle — CSE-3112 Software Engineering Lab</div>
  </footer>
</body>
</html>
