<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My requests — WRR</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/pages/user-requests.js"></script>
</head>
<body>
  <header id="app-header" class="site-header"></header>

  <main class="container">
    <div class="page-title">
      <h1>My requests</h1>
      <a class="btn btn-primary" href="/user/new-request.html">New pickup request</a>
    </div>

    <section class="card mb-2">
      <form id="filters" class="filters" novalidate>
        <div class="field">
          <label for="status">Status</label>
          <select id="status" name="status">
            <option value="">All</option>
            <option>Pending</option>
            <option>Assigned</option>
            <option>Accepted</option>
            <option>Rejected</option>
            <option>Collected</option>
            <option>Completed</option>
            <option>Cancelled</option>
          </select>
        </div>
        <div class="field">
          <label for="category_id">Category</label>
          <select id="category_id" name="category_id">
            <option value="">All</option>
          </select>
        </div>
        <div class="field">
          <label for="from">Submitted from</label>
          <input id="from" name="from" type="date">
        </div>
        <div class="field">
          <label for="to">to</label>
          <input id="to" name="to" type="date">
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary btn-small">Apply</button>
          <button type="button" class="btn btn-secondary btn-small" id="reset">Reset</button>
        </div>
        <div class="form-alert alert" role="alert"></div>
      </form>
    </section>

    <div class="grid grid-2">
      <section class="card">
        <p class="muted small mb-0" id="count"></p>
        <div id="list"></div>
        <div class="pager hidden" id="pager">
          <button type="button" class="btn btn-secondary btn-small" id="prev">Previous</button>
          <span class="muted small" id="page-info"></span>
          <button type="button" class="btn btn-secondary btn-small" id="next">Next</button>
        </div>
      </section>

      <section class="card sticky-panel" id="detail" aria-live="polite">
        <p class="empty mb-0">Select a request to see its details and timeline.</p>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">Waste Resource Recycle — CSE-3112 Software Engineering Lab</div>
  </footer>
</body>
</html>
