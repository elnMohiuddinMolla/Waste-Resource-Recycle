<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Record weight — WRR</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/style.css">
  <script type="module" src="/js/pages/collector-record-weight.js"></script>
</head>
<body>
  <header id="app-header" class="site-header"></header>

  <main class="container">
    <div class="page-title">
      <h1 id="title">Record weight</h1>
      <a href="/collector/requests.html" class="small">Back to my jobs</a>
    </div>

    <div class="grid grid-2">
      <section class="card" id="job">
        <div class="loading">Loading job…</div>
      </section>

      <div>
        <!-- Step 1: weigh (shown while the job is Accepted) -->
        <section class="card hidden" id="weigh-card">
          <h2>1. Weigh the waste</h2>
          <form id="weigh-form" class="form" novalidate>
            <div class="form-alert alert" role="alert"></div>
            <div class="field">
              <label for="actual_weight_kg">Actual weight on the scale (kg)</label>
              <input id="actual_weight_kg" name="actual_weight_kg" type="number" inputmode="decimal" min="0.01" step="0.01" required>
              <div class="field-error"></div>
            </div>
            <div class="field">
              <label for="remarks">Remarks <span class="muted">(optional)</span></label>
              <textarea id="remarks" name="remarks" maxlength="1000" placeholder="e.g. Dry cardboard, digital scale"></textarea>
              <div class="field-error"></div>
            </div>
            <div class="preview">
              <div class="stat-label">Points for the household</div>
              <div class="stat-value" id="preview">—</div>
              <div class="muted small" id="preview-note">Enter the weight.</div>
            </div>
            <p class="muted small mb-0" id="draft-note"></p>
            <button type="submit" class="btn btn-primary btn-block">Save weight</button>
          </form>
        </section>

        <!-- Step 2: complete (shown while the job is Collected) -->
        <section class="card hidden" id="complete-card">
          <h2>2. Complete the job</h2>
          <p id="weighed-text"></p>
          <p class="muted small">Completing credits the points to the household straight away.</p>
          <button type="button" class="btn btn-primary btn-block" id="complete">Mark as completed</button>
        </section>

        <!-- Done -->
        <section class="card hidden" id="done-card">
          <h2>Job completed</h2>
          <p id="done-text"></p>
          <div class="row">
            <a class="btn btn-primary" href="/collector/requests.html">Back to my jobs</a>
            <a class="btn btn-secondary" href="/collector/records.html">History</a>
          </div>
        </section>

        <!-- Any other status -->
        <section class="card hidden" id="other-card">
          <p id="other-text" class="mb-0"></p>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">Waste Resource Recycle — CSE-3112 Software Engineering Lab</div>
  </footer>
</body>
</html>
